name: Validate AJ 0.3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/validate-aj-0.3.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests, lint and optimized unsigned release
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify package boundaries
        run: |
          apk=android/owner/build/outputs/apk/release/app-release-unsigned.apk
          if unzip -Z1 "$apk" | grep -Ei '(^|/)[^/]+\.(apk|p12|jks|keystore|password)$'; then exit 1; fi
          unzip -Z1 "$apk" | grep -Fx 'assets/licenses/LICENSE'
          unzip -Z1 "$apk" | grep -Fx 'assets/licenses/NOTICE.md'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aj-0.3-validation
          path: |
            android/owner/build/reports/tests/testDebugUnitTest/
            android/owner/build/reports/lint-results-debug.html
            android/owner/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable the emulator accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launcher and Android Keystore on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: AJ-owner-phone-preview
          path: android/owner/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
